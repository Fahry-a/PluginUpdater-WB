# ========================================== #
#            PluginUpdater-WB                #
# ========================================== #

# The Minecraft version used to query Modrinth.
# Leave blank to auto-detect from the running server (recommended).
# If the exact version has no builds on Modrinth, the plugin retries without this
# filter and takes the latest available release, since Paper keeps older builds
# working through its backwards compatibility layer.
minecraft-version: ''

# List of usernames allowed to use the commands even if they do not have OP or the pluginupdater.admin permission.
allowed-players:
  - 'YourUsernameHere'

# Overrides the loader type sent to Modrinth.
# Defaults to "paper". Can be set to "auto" to detect if you are running paper/spigot/etc.
# Valid options: "auto", "paper", "purpur", "folia", "spigot", "bukkit"
server-type-override: 'paper'

# Default release channel for newly detected plugins.
# This is only a default: per-plugin channels set via /upd plugin track are kept.
# Valid options: "release", "beta", "alpha", "all"
tracking-type: 'all'

# Optional GitHub personal access token. Raises the API rate limit from
# 60 to 5,000 requests per hour. Leave blank to stay anonymous.
github-token: ''

# ========================================== #
#              Geyser Addons                 #
# ========================================== #
# Manages the two Geyser-ecosystem artifacts that cannot be regular plugins.
# Turn enabled to 'true' to manage them via '/upd plugin geyser'
# Geyser itself is tracked as a regular plugin via Modrinth (see plugins.yml),
# NOT here - the legacy geyser-addons.Geyser keys are removed automatically.
# Floodgate stages to update/ (restart to apply); MCXboxBroadcast writes
# directly to Geyser-Spigot/extensions/ with a .bak backup (restart Geyser to load).
geyser-addons:
  enabled: false
  Floodgate: true
  MCXboxBroadcast: true
  # Floodgate: Spigot jar exists on no versioned API (Modrinth bWrNNfkb is
  # Fabric/NeoForge only, GitHub has no releases). Change detection uses
  # HEAD ETag/Last-Modified, stored back as Floodgate-etag/Floodgate-last-modified.
  Floodgate-url: 'https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot'
  Floodgate-file: 'floodgate.jar'
  # MCXboxBroadcast: GitHub release with an explicit asset pin (the release also
  # ships a Standalone jar, so fuzzy matching would refuse to choose).
  MCXboxBroadcast-repo: 'MCXboxBroadcast/Broadcaster'
  MCXboxBroadcast-asset: 'MCXboxBroadcastExtension.jar'
  MCXboxBroadcast-file: 'MCXboxBroadcastExtension.jar'

# Per-plugin tracking state lives in plugins.yml (auto-generated on first run).
# Optional per-plugin keys:
#   expected-sha1 / expected-sha256: pin a CUSTOM (or any) download; matching installed jar = up to date.
#   last-etag / last-modified / last-sha256: auto-recorded after each download; used to
#     skip CUSTOM/SPIGOT re-downloads when the remote file has not changed.
#   game-version-filter (default true): set false to skip the Modrinth game_versions
#     filter and query unfiltered directly (seeded false for Geyser, whose builds
#     never target the newest game version).
#   github-asset: exact release asset filename to prefer (skips fuzzy matching).
# See the README for the entry format.